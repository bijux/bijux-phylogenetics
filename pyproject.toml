[dependency-groups]
dev = [
    "bijux-phylogenetics[dev,docs]",
    "phylogenetic[dev]",
    "bijux-phylogenetics-dev[dev]",
    "mkdocs-redirects>=1.2.1,<2.0",
    "mkdocs-material==9.8.1",
    "pymdown-extensions>=13.1.2",
    "PyYAML>=6.0,<7.0",
    "prance>=23.6.21.0",
    "openapi-spec-validator>=0.7.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
major_version_zero = true
annotated_tag = true
version_provider = "scm"
tag_format = "v$version"
update_changelog_on_bump = false

[tool.bijux_phylogenetics]
repository = "bijux-phylogenetics"
api_dir = "apis"
packages = [
    "bijux-phylogenetics",
    "phylogenetic",
    "bijux-phylogenetics-dev",
]
badge_packages = [
    "bijux-phylogenetics",
    "phylogenetic",
]
docs_package = "bijux-phylogenetics-dev"
config_dir = "configs"
make_dir = "makes"

# Shared workspace package index consumed by common Bijux make tooling.
[tool.bijux_phylogenetics.package_dirs]
"bijux-phylogenetics" = "packages/bijux-phylogenetics"
"phylogenetic" = "packages/phylogenetic"
"bijux-phylogenetics-dev" = "packages/bijux-phylogenetics-dev"

[tool.uv]
constraint-dependencies = [
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "gitpython>=3.2.1",
  "msgpack>=1.2.3",
  "uv>=0.13.4",
  "virtualenv>=21.14.9",
  "pillow>=13.0",
]

[tool.uv.sources]
bijux-phylogenetics = { workspace = true }
phylogenetic = { workspace = true }
bijux-phylogenetics-dev = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.interrogate]
fail-under = 32
color = true

[tool.bandit]
skips = ["B404", "B311"]
exclude_dirs = [".venv", "tests", "artifacts", ".pytest_cache", ".ruff_cache"]
