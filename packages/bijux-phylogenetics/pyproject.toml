[build-system]
requires = ["hatchling>=1.27.0,<1.33", "hatch-vcs>=0.4.0,<1.0"]
build-backend = "hatchling.build"

[project]
name = "bijux-phylogenetics"
description = "Comprehensive phylogenetics runtime for tree analysis, native inference, comparative models, parsimony, and evidence-linked reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
license-files = []
authors = [
    { name = "Bijan Mousavi", email = "bijan@bijux.io" },
]
keywords = [
    "ancestral-state-reconstruction",
    "bayesian-inference",
    "bioinformatics",
    "comparative-biology",
    "comparative-methods",
    "evolution",
    "maximum-likelihood",
    "parsimony",
    "phylogenomics",
    "phylogenetics",
    "sequence-analysis",
    "tree-analysis",
    "tree-comparison",
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "biopython>=1.87,<2.0",
    "cairosvg>=2.9.0,<3.0",
    "defusedxml>=0.7.1,<1.0",
    "PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://bijux.io/bijux-phylogenetics/"
Documentation = "https://bijux.io/bijux-phylogenetics/01-bijux-phylogenetics/"
"Native Workflows" = "https://bijux.io/bijux-phylogenetics/01-bijux-phylogenetics/operations/"
"Evidence Book" = "https://bijux.io/bijux-phylogenetics/03-bijux-phylogenetics-evidence-book/"
Benchmarks = "https://bijux.io/bijux-phylogenetics/01-bijux-phylogenetics/operations/native-benchmark-review/"
"Interface Guide" = "https://bijux.io/bijux-phylogenetics/01-bijux-phylogenetics/interfaces/surface-selection/"
"Artifact Guide" = "https://bijux.io/bijux-phylogenetics/01-bijux-phylogenetics/interfaces/artifact-consumption-guide/"
"Release Guide" = "https://bijux.io/bijux-phylogenetics/01-bijux-phylogenetics/quality/release-review-workflow/"
Repository = "https://github.com/bijux/bijux-phylogenetics"
Source = "https://github.com/bijux/bijux-phylogenetics"
Issues = "https://github.com/bijux/bijux-phylogenetics/issues"
Tracker = "https://github.com/bijux/bijux-phylogenetics/issues"
Changelog = "https://github.com/bijux/bijux-phylogenetics/blob/main/packages/bijux-phylogenetics/CHANGELOG.md"
Security = "https://github.com/bijux/bijux-phylogenetics/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-xdist>=3.8.0,<4.0",
    "pytest-asyncio>=1.0.0,<2.0",
    "pytest-cov>=6.2.1,<8.0",
    "pytest-timeout>=2.4.0,<3.0",
    "hatch>=1.14.0,<2.0",
    "pydantic>=2.12,<3.0",
    "ruff>=0.13.0,<1.0",
    "mypy>=1.18.2,<3.0",
    "vulture>=2.14,<3.0",
    "deptry>=0.24.0,<1.0",
    "bandit>=1.8.6,<2.0",
    "pip-audit>=2.9.0,<3.0",
    "build>=1.3.0,<2.0",
    "codespell>=2.4.1,<3.0",
    "interrogate>=1.7.0,<2.0",
    "pydocstyle>=6.3.0,<7.0",
    "radon>=6.0.1,<7.0",
    "types-defusedxml>=0.7.0.20240218,<1.0",
    "twine>=6.2.0,<7.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.2",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-material>=9.6.12",
    "pymdown-extensions>=10.21.3",
]

[project.scripts]
bijux-phylogenetics = "bijux_phylogenetics.command_line:main"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.*)$"
fallback-version = "0.1.2"
raw-options = { git_describe_command = "git describe --dirty --tags --long --match 'v*'", local_scheme = "dirty-tag", version_scheme = "guess-next-dev", root = "../..", search_parent_directories = true }

[tool.hatch.build]
include = [
    "README.md",
    "CHANGELOG.md",
    "src/bijux_phylogenetics/**",
]

[tool.hatch.build.targets.sdist]
exclude = ["LICENSE", "NOTICE", "tests"]
include = [
    "README.md",
    "CHANGELOG.md",
    "src/bijux_phylogenetics/**",
]
force-include = { "../../LICENSE" = "LICENSE", "../../NOTICE" = "NOTICE" }

[tool.hatch.build.targets.wheel]
packages = ["src/bijux_phylogenetics"]

[tool.interrogate]
fail-under = 58
verbose = 0
ignore-init-method = true
ignore-module = true
ignore-private = true
ignore-semiprivate = true
