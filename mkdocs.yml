INHERIT: mkdocs.shared.yml

site_name: Bijux Phylogenetics
site_description: Native phylogenetic runtime, comparative workflows, benchmark evidence, and evidence-linked reporting documentation.
site_url: !ENV [SITE_URL, https://bijux.io/bijux-phylogenetics/]
site_author: Bijan Mousavi <bijan@bijux.io>
repo_name: bijux/bijux-phylogenetics
repo_url: https://github.com/bijux/bijux-phylogenetics
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: badges.md
strict: true
site_dir: artifacts/root/docs/site
watch:
  - docs
  - docs/assets
  - docs/overrides
  - .bijux/shared/bijux-docs
  - mkdocs.yml
  - mkdocs.shared.yml
  - packages/bijux-phylogenetics-dev/src/bijux_phylogenetics_dev/docs

theme:
  custom_dir: docs/overrides

extra:
  bijux:
    repository: bijux-phylogenetics
    docs_package: bijux-phylogenetics-dev
    nav_mode: default
    theme_key: bijux:theme
    hub_links:
      - key: bijux
        label: Bijux
        url: https://bijux.io/
      - key: bijux-core
        label: Core
        url: https://bijux.io/bijux-core/
      - key: bijux-proteomics
        label: Proteomics
        url: https://bijux.io/bijux-proteomics/
      - key: bijux-pollenomics
        label: Pollenomics
        url: https://bijux.io/bijux-pollenomics/
      - key: bijux-phylogenetics
        label: Phylogenetics
        url: https://bijux.io/bijux-phylogenetics/
      - key: bijux-canon
        label: Canon
        url: https://bijux.io/bijux-canon/
      - key: bijux-atlas
        label: Atlas
        url: https://bijux.io/bijux-atlas/
      - key: bijux-masterclass
        label: Masterclass
        url: https://bijux.io/bijux-masterclass/

not_in_nav: |
  assets/**
  report/**/*.html
  report/**/*.json
  report/**/*.md

nav:
  - Home: index.md
  - Phylogenetics:
      - Overview: phylogenetics/index.md
      - Foundation:
          - Overview: phylogenetics/foundation/index.md
          - Claim Reading Guide: phylogenetics/foundation/claim-reading-guide.md
          - Repository Scope and Limits: phylogenetics/foundation/repository-scope-and-limits.md
          - Product Surface and Ownership: phylogenetics/foundation/product-surface-and-ownership.md
          - Runtime and Evidence Boundary: phylogenetics/foundation/evidence-boundary.md
      - Architecture:
          - Overview: phylogenetics/architecture/index.md
          - Runtime System Map: phylogenetics/architecture/runtime-system-map.md
          - Package Map: phylogenetics/architecture/package-map.md
          - Evidence Consumer Boundary: phylogenetics/architecture/evidence-consumer-boundary.md
      - Interfaces:
          - Overview: phylogenetics/interfaces/index.md
          - Surface Selection Guide: phylogenetics/interfaces/surface-selection.md
          - API Surface: phylogenetics/interfaces/api-surface.md
          - CLI Surface: phylogenetics/interfaces/cli-surface.md
          - Python Surface: phylogenetics/interfaces/python-surface.md
          - Native Inference and Benchmarks: phylogenetics/interfaces/native-inference-and-benchmarks.md
          - Artifact Consumption Guide: phylogenetics/interfaces/artifact-consumption-guide.md
          - Artifact Contracts: phylogenetics/interfaces/artifact-contracts.md
      - Operations:
          - Overview: phylogenetics/operations/index.md
          - Installation and Setup: phylogenetics/operations/installation-and-setup.md
          - Common Workflows: phylogenetics/operations/common-workflows.md
          - Native Maximum-Likelihood Workflows: phylogenetics/operations/native-maximum-likelihood-workflows.md
          - Native Bayesian Workflows: phylogenetics/operations/native-bayesian-workflows.md
          - Native Benchmark Review: phylogenetics/operations/native-benchmark-review.md
          - Operational Boundaries: phylogenetics/operations/operational-boundaries.md
      - Quality:
          - Overview: phylogenetics/quality/index.md
          - Test Strategy: phylogenetics/quality/test-strategy.md
          - Validation Lanes: phylogenetics/quality/validation-lanes.md
          - Native Benchmark Evidence: phylogenetics/quality/native-benchmark-evidence.md
          - Release Review Workflow: phylogenetics/quality/release-review-workflow.md
          - Release and Publication Gates: phylogenetics/quality/release-and-publication-gates.md
          - Evidence Honesty and Limits: phylogenetics/quality/evidence-honesty-and-limits.md
  - Evidence Book:
      - Overview: phylogenetics-evidence-book/index.md
      - PCM1:
          - Overview: phylogenetics-evidence-book/pcm1-primate-longevity-signal/index.md
          - Data and Tree Preparation: phylogenetics-evidence-book/pcm1-primate-longevity-signal/data-and-tree-preparation.md
          - Signal and Ancestral Results: phylogenetics-evidence-book/pcm1-primate-longevity-signal/signal-and-ancestral-results.md
      - PCM2:
          - Overview: phylogenetics-evidence-book/pcm2-primate-pgls-and-signal/index.md
          - Model Comparisons and PGLS: phylogenetics-evidence-book/pcm2-primate-pgls-and-signal/model-comparisons-and-pgls.md
          - Signal Diagnostics and Open Boundaries: phylogenetics-evidence-book/pcm2-primate-pgls-and-signal/signal-diagnostics-and-open-boundaries.md
      - PCM3:
          - Overview: phylogenetics-evidence-book/pcm3-primate-continuous-and-categorical-regression/index.md
          - Model Design and Phylogenetic Regression: phylogenetics-evidence-book/pcm3-primate-continuous-and-categorical-regression/model-design-and-phylogenetic-regression.md
      - PCM4:
          - Overview: phylogenetics-evidence-book/pcm4-cichlid-bayesian-linear-and-phylogenetic-mixed-models/index.md
          - Mixed-Model Evidence Boundary: phylogenetics-evidence-book/pcm4-cichlid-bayesian-linear-and-phylogenetic-mixed-models/mixed-model-evidence-boundary.md
      - PCM5:
          - Overview: phylogenetics-evidence-book/pcm5-cichlid-phylogenetic-generalized-linear-mixed-models/index.md
          - Generalized Mixed-Model Evidence Boundary: phylogenetics-evidence-book/pcm5-cichlid-phylogenetic-generalized-linear-mixed-models/generalized-mixed-model-evidence-boundary.md
  - Maintainer:
      - Overview: phylogenetics-maintainer/index.md
      - Documentation Ownership: phylogenetics-maintainer/documentation-ownership.md
      - Native Surface Documentation: phylogenetics-maintainer/native-surface-documentation.md
      - Public Trust Surface Maintenance: phylogenetics-maintainer/public-trust-surface-maintenance.md
      - Public Interface And Artifact Maintenance: phylogenetics-maintainer/public-interface-and-artifact-maintenance.md
      - Trust Lane And Study Guide Maintenance: phylogenetics-maintainer/trust-lane-and-study-guide-maintenance.md
      - Release Surface Alignment: phylogenetics-maintainer/release-surface-alignment.md
